name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check flake outputs
        run: nix flake check

      - name: Build pvpn package
        run: nix build .#pvpn

      - name: Verify binaries
        run: |
          ./result/bin/pvpn --version
          ./result/bin/pvpnctl --version
          ./result/bin/pvpnd --version
